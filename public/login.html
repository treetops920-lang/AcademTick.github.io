<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Academtick | Login</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>

<body class="login-page">

  <main class="login-container">

    <!-- Brand -->
    <div class="login-brand">
      <img src="image/TickBot-login.png" alt="Academtick" class="login-logo" />
    </div>

    <!-- Login Card -->
    <section class="login-card">
      <header class="login-header">
        <h1>Sign in</h1>
        <p>Use your Academtick account</p>
      </header>

      <form class="login-form" method="post" action="#">
        <div class="field">
          <label for="email">Username</label>
          <input class="input" id="email" name="username" type="text" placeholder="Username" required />
        </div>


        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" placeholder="••••••••" required />
        </div>

        <div class="login-options">
          <label class="remember">
            <input type="checkbox" />
            Remember me
          </label>

          <a href="#" class="link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-accent login-btn">
          Sign in
        </button>
        <script src="js/login.js"></script>
      </form>



      <footer class="login-footer">
        <span>Don’t have an account?</span>
        <a href="#" class="link">Contact IT</a>
      </footer>
    </section>

  </main>

</body>

</html>
